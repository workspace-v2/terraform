modules:
  http_health:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"status":"UP"'

  # Any response from Spring through Caddy counts as reachable; TLS must be valid.
  https_public:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [200, 301, 302, 401, 403, 404]
