apiVersion: 1
datasources:
  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  - name: tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
