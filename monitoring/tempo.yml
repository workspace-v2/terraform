# Grafana Tempo (단일 바이너리, 로컬 디스크 저장)
# 백엔드(ECS)가 OTLP HTTP(4318)로 트레이스를 보내고, Grafana 가 3200 으로 조회한다 (docker network monitoring).
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 720h # 30일 (Prometheus 보관 기간과 맞춤)

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
